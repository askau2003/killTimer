name: CI

# What can be checked without the game running: both Lua files compile, every
# global the addon touches is a real API name (luacheck, see .luacheckrc), the
# behaviour regressions in tests/ still hold, and the version/changelog pair that
# release.yml turns into release notes is consistent.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lua 5.1 specifically, because that's the interpreter WoW itself runs.
      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Lint
        run: luacheck .

      - name: Compile
        run: |
          lua5.1 -e "assert(loadfile('killTimer.lua'))"
          lua5.1 -e "assert(loadfile('killTimerOptions.lua'))"

      - name: Test
        run: lua5.1 tests/run.lua

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check killTimer.toc against CHANGELOG.md
        run: ./scripts/check-versions.sh
