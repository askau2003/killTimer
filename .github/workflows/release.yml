name: Release

# Packaging killTimer.toc/.lua into a zip and attaching it to a GitHub release
# used to be a manual step (and needs `zip`, which isn't always installed) -
# pushing a `v*` tag now does it automatically, using CHANGELOG.md's matching
# "## [x.y]" section as the release notes (see CLAUDE.md for the convention).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package addon
        run: |
          mkdir -p dist/killTimer
          cp killTimer.toc killTimer.lua killTimerOptions.lua dist/killTimer/
          (cd dist && zip -r killTimer-forever.zip killTimer)

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag
          ' CHANGELOG.md > dist/notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/killTimer-forever.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md
