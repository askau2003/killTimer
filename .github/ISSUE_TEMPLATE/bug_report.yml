name: Bug report
description: Report a problem with the killTimer addon
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: killTimer version
      description: Settings > AddOns > killTimer, or the `## Version` line in killTimer.toc.
      placeholder: "1.4"
    validations:
      required: true

  - type: dropdown
    id: restedxp
    attributes:
      label: Is RestedXP installed and enabled?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Lua errors (if any)
      description: >
        Paste any error text here, e.g. from BugSack/!BugGrabber if you have one enabled.
        Leave blank if you didn't see any errors.
    validations:
      required: false
